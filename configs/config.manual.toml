[Telegram-HushTelegram]
enabled = true
pkg-name = "org.telegram.messenger.web"
app-name = "Telegram"
patches-source = "SysAdminDoc/HushTelegram"
brand = "HushTelegram"
arch = "arm64-v8a"
inclusive-patches = true
build-mode = "apk"
patcher-args = "-e 'Use registered Telegram API credentials' -OapiId=$TELEGRAM_API_ID -OapiHash=$TELEGRAM_API_HASH"
apkmirror-dlurl = "https://www.apkmirror.com/apk/telegram-fz-llc/telegram-web-version"
uptodown-dlurl = "https://telegram.en.uptodown.com/android"
