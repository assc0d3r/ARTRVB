name: Notify Builder Repository

on:
  push:
    branches:
      - main
    paths:
      - 'patches/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify Changed Patch Folders
        id: changes
        run: |
          # Detect changed sub-folders inside patches directory
          CHANGED_FOLDERS=$(git diff --name-only HEAD~1 HEAD | grep '^patches/' | cut -d'/' -f2 | sort -u | jq -R . | jq -s -c .)
          echo "folders=$CHANGED_FOLDERS" >> $GITHUB_OUTPUT

      - name: Send Repository Dispatch Event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BUILDER_REPO_PAT }}
          repository: your-username/your-builder-repo
          event-type: patch_updated
          client_payload: '{"changed_folders": ${{ steps.changes.outputs.folders }}}'
